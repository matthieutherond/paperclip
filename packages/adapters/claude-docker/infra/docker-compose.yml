services:
  credential-proxy:
    image: node:20-slim
    command: ["node", "/proxy/credential-proxy.mjs"]
    volumes:
      - ./credential-proxy.mjs:/proxy/credential-proxy.mjs:ro
      - ${GITHUB_APP_KEY_PATH:-/dev/null}:/secrets/github-app.pem:ro
    env_file:
      - path: .env
        required: false
    networks: [agent-net]
    restart: unless-stopped

networks:
  agent-net:
    driver: bridge
